spring.application.name=multas-biblioteca-api

spring.datasource.url=jdbc:h2:mem:multas_biblioteca_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

server.port=8080

# ---- Parte 2: pago en linea ----
# Cambiar a "wompi" activa WompiAdapter en su lugar; MultaService no se toca.
app.pagos.proveedor=wompi

# Pasarelas SIMULADAS dentro de esta misma app (ver paquete mock/).
# Si tienes pasarelas reales o un mock externo, cambia las URLs (ej. localhost:9001 / 9002).
app.pagos.pagosudes.url=http://localhost:8080/mock/pagosudes/transacciones
app.pagos.wompi.url=http://localhost:8080/mock/wompi/transactions
app.pagos.mock.enabled=true
